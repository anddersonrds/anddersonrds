  <text x="290" y="116" fill="#c9d1d9" font-family="system-ui,-apple-system,sans-serif" font-size="13">📐 Agile &amp; Scrum practices</text>
  <text x="290" y="139" fill="#c9d1d9" font-family="system-ui,-apple-system,sans-serif" font-size="13">🎯 OKRs &amp; technical strategy</text>

