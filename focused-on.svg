<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170">

  <!-- Background panel matching GitHub dark mode -->
  <rect width="800" height="170" rx="8" fill="#161b22"/>

  <!-- ─── Column 1: AI & Machine Learning ─── -->
